name: Staging pipeline

on:
  push:
    branches: [main]

concurrency:
  group: staging-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for cosign keyless signing via GitHub OIDC

jobs:
  build-scan-sign:
    name: Scan, Build, Push, and Sign (staging)
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      backend-digest: ${{ steps.push-backend.outputs.digest }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, needed for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend -f json -o bandit-report.json --severity-level medium --confidence-level medium

      - name: pip audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --format json --output pip-audit.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: npm audit
        working-directory: frontend
        run: |
          npm install
          npm audit --audit-level high --json > npm-audit.json

      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          output: trivy-fs-results.txt

      - name: Run Hadolint on Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          output-file: hadolint-backend.txt
          no-fail: true

      - name: Run Hadolint on Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          output-file: hadolint-frontend.txt
          no-fail: true

      - name: Upload Source Scan Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-reports-staging
          path: |
            bandit-report.json
            pip-audit.json
            frontend/npm-audit.json
            trivy-fs-results.txt
            hadolint-backend.txt
            hadolint-frontend.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Image Tag
        id: version
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tag=staging-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # push: false, load: true keeps the image on the runner only, nothing
      # reaches Docker Hub until it's been scanned below.
      - name: Build Backend Image (local only)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}:latest-staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image (local only)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:latest-staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          output: trivy-backend-image.txt

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          output: trivy-frontend-image.txt

      - name: Upload Trivy Image Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report-staging
          path: |
            trivy-backend-image.txt
            trivy-frontend-image.txt
          if-no-files-found: warn
          retention-days: 14

      # Only reached if both image scans passed.
      - name: Push Backend Image
        id: push-backend
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
          PUSH_OUTPUT=$(docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}:latest-staging)
          DIGEST=$(echo "$PUSH_OUTPUT" | grep -oP 'sha256:[a-f0-9]{64}' | head -1)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Push Frontend Image
        id: push-frontend
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
          PUSH_OUTPUT=$(docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:latest-staging)
          DIGEST=$(echo "$PUSH_OUTPUT" | grep -oP 'sha256:[a-f0-9]{64}' | head -1)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Generate Backend SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
          format: cyclonedx
          output: sbom-backend.cdx.json

      - name: Generate Frontend SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
          format: cyclonedx
          output: sbom-frontend.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-staging
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
          retention-days: 30

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Backend Image (keyless, GitHub OIDC)
        run: |
          cosign sign --yes \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}@${{ steps.push-backend.outputs.digest }}

      - name: Sign Frontend Image (keyless, GitHub OIDC)
        run: |
          cosign sign --yes \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}@${{ steps.push-frontend.outputs.digest }}

  approval:
    name: Manual Approval for Staging Deploy
    runs-on: ubuntu-latest
    needs: build-scan-sign
    environment: staging-deploy-approval
    steps:
      - name: Approval checkpoint
        run: echo "Approved for staging deployment."

  deploy:
    name: Deployment to staging
    runs-on: ubuntu-latest
    environment: staging
    needs: [build-scan-sign, approval]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          source: "compose.stag.yml,nginx/,scripts/"
          target: "~/shophive"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          envs: DEPLOY_ENV_FILE
          script: |
            set -e
            cd ~/shophive
            echo "$DEPLOY_ENV_FILE" > .env
            docker compose -f compose.stag.yml pull
            docker compose -f compose.stag.yml up -d --remove-orphans
            docker image prune -f
        env:
          DEPLOY_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
