name: Reusable - Dependency Vulnerability Scan

on:
  workflow_call:
    inputs:
      artifact-suffix:
        required: true
        type: string
      fail-on-findings:
        required: false
        type: boolean
        default: false
      retention-days:
        required: false
        type: number
        default: 7

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: pip audit
        continue-on-error: ${{ !inputs.fail-on-findings }}
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --format json --output pip-audit.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: npm audit
        working-directory: frontend
        continue-on-error: ${{ !inputs.fail-on-findings }}
        run: |
          npm install
          npm audit --audit-level high --json > npm-audit.json

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report-${{ inputs.artifact-suffix }}
          path: |
            pip-audit.json
            frontend/npm-audit.json
          retention-days: ${{ inputs.retention-days }}
