name: Development pipeline

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: kailashbadu/shophive-backend
  FRONTEND_IMAGE: kailashbadu/shophive-frontend

jobs:
  # SECRET SCANNING
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  # SAST AND DEPENDENCY SECURITY
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend -f json -o bandit-report.json --severity-level medium --confidence-level medium || true

      - name: Upload Bandit Report
        uses: actions/upload-artifct@v7
        with:
          name: bandit-report-dev
          path: bandit-report.json
          retention-days: 7

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: pip audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --format json --output pip-audit.json || true


      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: npm audit
        working-directory: frontend
        run: |
          npm install
          npm audit --audit-level high --json > npm-audit.json || true

      - name: Upload dependency reports
        uses: actions/upload-artifct@v7
        with:
          name: dependency-report-dev
          path: |
            pip-audit.json
            frontend/npm-audit.json
          retention-days: 7


