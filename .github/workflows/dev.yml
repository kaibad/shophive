name: Development pipeline

on:
  push:
    branches: [dev]

jobs:
  gitleaks:
    uses: ./.github/workflows/reusable-secret-scan.yml
    secrets: inherit

  sast:
    needs: gitleaks
    uses: ./.github/workflows/reusable-sast.yml
    with:
      artifact-suffix: dev
      fail-on-findings: false
      retention-days: 7

  dependency-scan:
    needs: gitleaks
    uses: ./.github/workflows/reusable-dependency-scan.yml
    with:
      artifact-suffix: dev
      fail-on-findings: false
      retention-days: 7

  trivy-fs:
    needs: gitleaks
    uses: ./.github/workflows/reusable-trivy-fs.yml
    with:
      artifact-suffix: dev
      exit-code: 0
      retention-days: 7

  build:
    needs: [sast, dependency-scan, trivy-fs]
    uses: ./.github/workflows/reusable-build.yml
    with:
      environment: development
      tag-prefix: dev
    secrets: inherit

  trivy-image:
    needs: build
    uses: ./.github/workflows/reusable-trivy-image.yml
    with:
      environment: development
      artifact-suffix: dev
      image-tag: ${{ needs.build.outputs.tag }}
      exit-code: 0
      retention-days: 7
    secrets: inherit

  deploy:
    needs: trivy-image
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: development
      compose-file: compose.dev.yml
    secrets:
      ec2-host: ${{ secrets.DEV_EC2_HOST }}
      ec2-user: ${{ secrets.DEV_EC2_USER }}
      ec2-ssh-key: ${{ secrets.DEV_EC2_SSH_KEY }}
      env-file: ${{ secrets.DEV_ENV_FILE }}

  health-check:
    name: Health check
    runs-on: ubuntu-latest
    environment: development
    needs: deploy
    steps:
      - name: Check app health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            cd ~/shophive
            ./scripts/dev/healthcheck.sh
