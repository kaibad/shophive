name: Reusable - Build and Push Images

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      tag-prefix:
        required: true
        type: string
    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}
      backend_digest:
        value: ${{ jobs.build.outputs.backend_digest }}
      frontend_digest:
        value: ${{ jobs.build.outputs.frontend_digest }}

jobs:
  build:
    name: Build Docker Images and push to Docker Hub
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      backend_digest: ${{ steps.build-backend.outputs.digest }}
      frontend_digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate Image Tag
        id: version
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tag=${{ inputs.tag-prefix }}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Backend Image
        id: build-backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}:latest-${{ inputs.tag-prefix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:latest-${{ inputs.tag-prefix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
