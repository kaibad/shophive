name: Production Pipeline

# Production pipeline: builds, scans, signs, and pushes images to ECR.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm you want to build & push a prod image"
        required: true
        default: ""

env:
  AWS_REGION: ap-south-1

permissions:
  id-token: write # required for OIDC
  contents: read
  security-events: write

jobs:
  # ------------------------------------------------------------------
  # 1. Guard: only continue for tag pushes, or manual dispatch with confirm
  # ------------------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate trigger
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.confirm }}" != "deploy" ]]; then
            echo "Manual run not confirmed. Input 'confirm' must equal 'deploy'."
            exit 1
          fi
          echo "Trigger validated."

  # ------------------------------------------------------------------
  # 2. Secret scanning
  # ------------------------------------------------------------------
  secrets-scan:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 3. Static / dependency security scans (backend + frontend)
  # ------------------------------------------------------------------
  code-scan:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        if: matrix.component == 'backend'
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt -f json -o pip-audit-report.json || true

      - name: Set up Node
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (frontend)
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: |
          npm ci
          npm audit --json > ../npm-audit-report.json || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ matrix.component }}/
          format: json
          output: trivy-fs-${{ matrix.component }}.json
          severity: CRITICAL,HIGH

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports-${{ matrix.component }}
          path: |
            bandit-report.json
            pip-audit-report.json
            npm-audit-report.json
            trivy-fs-${{ matrix.component }}.json
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 4. Build, scan image, sign, push to ECR
  # ------------------------------------------------------------------
  build-and-push:
    needs: [secrets-scan, code-scan]
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        component: [backend, frontend]
    outputs:
      backend_digest: ${{ steps.digest.outputs.backend_digest }}
      frontend_digest: ${{ steps.digest.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set component context (repo path + build context)
        id: component
        run: |
          if [ "${{ matrix.component }}" == "backend" ]; then
            echo "ecr_repo=${{ vars.BACKEND_ECR_REPO }}" >> "$GITHUB_OUTPUT"
            echo "context=./backend" >> "$GITHUB_OUTPUT"
          else
            echo "ecr_repo=${{ vars.FRONTEND_ECR_REPO }}" >> "$GITHUB_OUTPUT"
            echo "context=./frontend" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t ${{ matrix.component }}:${{ steps.vars.outputs.tag }} ${{ steps.component.outputs.context }}

      - name: Tag image for ECR
        run: |
          docker tag ${{ matrix.component }}:${{ steps.vars.outputs.tag }} \
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.component.outputs.ecr_repo }}:${{ steps.vars.outputs.tag }}

      - name: Trivy image scan (pre-push gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.component }}:${{ steps.vars.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Push image to ECR
        id: push
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ steps.component.outputs.ecr_repo }}:${{ steps.vars.outputs.tag }}

      - name: Capture image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.component.outputs.ecr_repo }}:${{ steps.vars.outputs.tag }} | cut -d'@' -f2)
          echo "${{ matrix.component }}_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.component.outputs.ecr_repo }}@${{ steps.digest.outputs[format('{0}_digest', matrix.component)] }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/${{ steps.component.outputs.ecr_repo }}:${{ steps.vars.outputs.tag }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.cdx.json

      - name: Attest SBOM to image (cosign)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.component }}.cdx.json \
            --type cyclonedx \
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.component.outputs.ecr_repo }}@${{ steps.digest.outputs[format('{0}_digest', matrix.component)] }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.cdx.json
