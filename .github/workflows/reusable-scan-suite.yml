name: Reusable - Scan Suite (SAST, Dependencies, Trivy FS, Hadolint)

on:
  workflow_call:
    inputs:
      artifact-suffix:
        required: true
        type: string
      fail-on-findings:
        required: false
        type: boolean
        default: false
      trivy-fs-exit-code:
        required: false
        type: number
        default: 0
      include-hadolint:
        required: false
        type: boolean
        default: false
      retention-days:
        required: false
        type: number
        default: 7
      runner:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  scan-suite:
    name: Scan Suite (SAST, Dependencies, Trivy FS, Hadolint)
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        continue-on-error: ${{ !inputs.fail-on-findings }}
        run: |
          bandit -r backend -f json -o bandit-report.json --severity-level medium --confidence-level medium

      - name: pip audit
        continue-on-error: ${{ !inputs.fail-on-findings }}
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --format json --output pip-audit.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: npm audit
        working-directory: frontend
        continue-on-error: ${{ !inputs.fail-on-findings }}
        run: |
          npm install
          npm audit --audit-level high --json > npm-audit.json

      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: ${{ inputs.trivy-fs-exit-code }}
          output: trivy-fs-results.txt

      - name: Run Hadolint on Backend Dockerfile
        if: inputs.include-hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          output-file: hadolint-backend.txt
          no-fail: true

      - name: Run Hadolint on Frontend Dockerfile
        if: inputs.include-hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          output-file: hadolint-frontend.txt
          no-fail: true

      - name: Upload Scan Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-reports-${{ inputs.artifact-suffix }}
          path: |
            bandit-report.json
            pip-audit.json
            frontend/npm-audit.json
            trivy-fs-results.txt
            hadolint-backend.txt
            hadolint-frontend.txt
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
