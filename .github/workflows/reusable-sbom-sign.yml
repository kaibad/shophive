name: Reusable - SBOM Generation and Image Signing

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      artifact-suffix:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      backend-digest:
        required: true
        type: string
      frontend-digest:
        required: true
        type: string
      retention-days:
        required: false
        type: number
        default: 30

jobs:
  sbom-and-sign:
    name: Generate SBOM and Sign Images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate Backend SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}:${{ inputs.image-tag }}
          format: cyclonedx
          output: sbom-backend.cdx.json

      - name: Generate Frontend SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ inputs.image-tag }}
          format: cyclonedx
          output: sbom-frontend.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.artifact-suffix }}
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
          retention-days: ${{ inputs.retention-days }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign Backend Image (keyless, GitHub OIDC)
        run: |
          cosign sign --yes \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_IMAGE }}@${{ inputs.backend-digest }}

      - name: Sign Frontend Image (keyless, GitHub OIDC)
        run: |
          cosign sign --yes \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_IMAGE }}@${{ inputs.frontend-digest }}
