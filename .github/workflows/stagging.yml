name: Staging pipeline

on:
  push:
    branches: [qa]

permissions:
  contents: read
  id-token: write # required for cosign keyless signing via GitHub OIDC

jobs:
  gitleaks:
    uses: ./.github/workflows/reusable-secret-scan.yml
    secrets: inherit

  sast:
    needs: gitleaks
    uses: ./.github/workflows/reusable-sast.yml
    with:
      artifact-suffix: staging
      fail-on-findings: true
      retention-days: 14

  dependency-scan:
    needs: gitleaks
    uses: ./.github/workflows/reusable-dependency-scan.yml
    with:
      artifact-suffix: staging
      fail-on-findings: true
      retention-days: 14

  trivy-fs:
    needs: gitleaks
    uses: ./.github/workflows/reusable-trivy-fs.yml
    with:
      artifact-suffix: staging
      exit-code: 1
      retention-days: 14

  hadolint:
    needs: gitleaks
    uses: ./.github/workflows/reusable-hadolint.yml
    with:
      artifact-suffix: staging
      retention-days: 14

  build:
    needs: [sast, dependency-scan, trivy-fs, hadolint]
    uses: ./.github/workflows/reusable-build.yml
    with:
      environment: staging
      tag-prefix: staging
    secrets: inherit

  trivy-image:
    needs: build
    uses: ./.github/workflows/reusable-trivy-image.yml
    with:
      environment: staging
      artifact-suffix: staging
      image-tag: ${{ needs.build.outputs.tag }}
      exit-code: 1
      retention-days: 14
    secrets: inherit

  sbom-and-sign:
    needs: [build, trivy-image]
    uses: ./.github/workflows/reusable-sbom-sign.yml
    with:
      environment: staging
      artifact-suffix: staging
      image-tag: ${{ needs.build.outputs.tag }}
      backend-digest: ${{ needs.build.outputs.backend_digest }}
      frontend-digest: ${{ needs.build.outputs.frontend_digest }}
      retention-days: 30
    secrets: inherit

  # MANUAL APPROVAL GATE
  approval:
    name: Manual Approval for Staging Deploy
    runs-on: ubuntu-latest
    needs:
      - trivy-image
      - sbom-and-sign
    environment: staging-deploy-approval
    steps:
      - name: Approval checkpoint
        run: echo "Approved for staging deployment."

  deploy:
    needs: approval
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
      compose-file: compose.stag.yml
    secrets:
      ec2-host: ${{ secrets.STAGING_EC2_HOST }}
      ec2-user: ${{ secrets.STAGING_EC2_USER }}
      ec2-ssh-key: ${{ secrets.STAGING_EC2_SSH_KEY }}
      env-file: ${{ secrets.STAGING_ENV_FILE }}
